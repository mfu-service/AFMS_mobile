name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/AFMS-1.0.0.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          name: AFMS 1.0.0
          files: dist/AFMS-1.0.0.apk
          generate_release_notes: true
          body: |
            ## Download on Android
            1. Open this page on your phone.
            2. Tap **AFMS-1.0.0.apk**.
            3. Allow install from this source if Android asks.
            4. Open the file and tap Install.

            Package: `dz.afms.mobile`
            Version: 1.0.0
